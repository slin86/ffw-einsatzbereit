# Local development database. Start with: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: einsatzbereit
      POSTGRES_PASSWORD: einsatzbereit
      POSTGRES_DB: einsatzbereit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
