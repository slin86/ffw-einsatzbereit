apiVersion: v1
kind: Service
metadata:
  name: einsatzbereit
spec:
  selector:
    app: einsatzbereit
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: einsatzbereit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: einsatzbereit
  template:
    metadata:
      labels:
        app: einsatzbereit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/slin86/einsatzbereit
          envFrom:
            - secretRef:
                name: einsatzbereit-secrets
          env:
            - name: EB_PUBLIC_BASE_URL
              value: https://einsatzbereit.slin.io
            - name: EB_COOKIE_SECURE
              value: "true"
            - name: TZ
              value: Europe/Berlin
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
