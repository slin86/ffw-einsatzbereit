# Dedicated PostgreSQL for Einsatzbereit.
# Storage is local-path on the NUC on purpose: Postgres on NFS is fragile, and the
# NAS disks use deep sleep. Backups go to the NAS via the separate backup CronJob.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: einsatzbereit-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: einsatzbereit-postgres
  template:
    metadata:
      labels:
        app: einsatzbereit-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: einsatzbereit
            - name: POSTGRES_DB
              value: einsatzbereit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: einsatzbereit-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "einsatzbereit"]
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
