# TODO: replace every CHANGE-ME value; placeholders silently block the secret sync
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: einsatzbereit-secrets
spec:
  hostAPI: CHANGE-ME
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: CHANGE-ME
        secretNamespace: CHANGE-ME
      secretsScope:
        projectSlug: CHANGE-ME
        envSlug: prod
        secretsPath: /einsatzbereit
  managedSecretReference:
    secretName: einsatzbereit-secrets
    secretNamespace: einsatzbereit
    creationPolicy: Owner
