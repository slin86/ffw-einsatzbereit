# Syncs the app secrets from Infisical into the Secret "einsatzbereit-secrets".
# Required keys:
#   EB_JWT_SECRET, EB_DATABASE_URL, POSTGRES_PASSWORD,
#   EB_INITIAL_ADMIN_EMAIL, EB_INITIAL_ADMIN_PASSWORD,
#   EB_SMTP_HOST, EB_SMTP_PORT, EB_SMTP_USERNAME, EB_SMTP_PASSWORD, EB_SMTP_FROM
# EB_DATABASE_URL = postgresql+psycopg://einsatzbereit:<POSTGRES_PASSWORD>@postgres:5432/einsatzbereit
#
# TODO: replace every value marked CHANGE-ME. Placeholder values silently block the sync.
# secretType is intentionally omitted (plain Opaque secret).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: einsatzbereit-secrets
spec:
  hostAPI: CHANGE-ME # e.g. http://infisical.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: CHANGE-ME # machine identity credentials secret
        secretNamespace: CHANGE-ME
      secretsScope:
        projectSlug: CHANGE-ME
        envSlug: prod
        secretsPath: /einsatzbereit
  managedSecretReference:
    secretName: einsatzbereit-secrets
    secretNamespace: einsatzbereit
    creationPolicy: Owner
