name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eb
          POSTGRES_PASSWORD: eb
          POSTGRES_DB: eb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eb" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql+psycopg://eb:eb@localhost:5432/eb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Migrations apply cleanly and match the models
        run: |
          EB_DATABASE_URL=$PG_URL uv run alembic upgrade head
          EB_DATABASE_URL=$PG_URL uv run alembic check
          EB_DATABASE_URL=$PG_URL uv run alembic downgrade base
      - name: Tests (PostgreSQL)
        run: EB_TEST_DATABASE_URL=$PG_URL uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/slin86/einsatzbereit:latest
            ghcr.io/slin86/einsatzbereit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
